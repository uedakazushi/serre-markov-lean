name: Verify and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Elan
        run: |
          curl --fail --location https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned mathlib cache
        run: lake exe cache get
      - name: Check the complete Lean project and axiom audit
        run: bash scripts/verify.sh
      - name: Verify Blueprint declarations and dependencies
        run: |
          python3 blueprint/scripts/verify_lean_refs.py
          python3 blueprint/scripts/check_structure.py
      - name: Install Blueprint build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgraphviz-dev pkg-config texlive-luatex texlive-lang-japanese texlive-latex-extra latexmk fonts-noto-cjk
          python3 -m pip install -r blueprint/requirements.txt
      - name: Restore and verify the fixed MathJax distribution
        run: |
          mkdir -p /tmp/serre-mathjax blueprint/web/vendor/mathjax
          cd /tmp/serre-mathjax
          npm pack mathjax@3.2.2
          tar -xzf mathjax-3.2.2.tgz
          cd "$GITHUB_WORKSPACE"
          cp -a /tmp/serre-mathjax/package/es5/. blueprint/web/vendor/mathjax/
          cp /tmp/serre-mathjax/package/LICENSE blueprint/web/vendor/mathjax/LICENSE
          python3 scripts/check_mathjax.py
      - name: Rebuild HTML and LuaLaTeX PDF from this commit
        run: |
          cd blueprint/src
          plastex -c plastex.cfg web.tex
          latexmk -lualatex -interaction=nonstopmode -halt-on-error -outdir=../print print.tex
      - name: Generate source links and check the website
        run: |
          python3 blueprint/scripts/build_lean_links.py --verify-links
          python3 blueprint/scripts/postprocess_web.py
          python3 blueprint/scripts/check_html_links.py
          python3 scripts/stage_pages.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-and-blueprint
          path: |
            blueprint/verification/
            blueprint/print/print.pdf
            _site/build-info.json
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
